[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "console-proxy"
version = "0.1.0"
description = "Proxy service for VNC and serial console sessions"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.10,<4",
  "redis>=5,<7",
]

[tool.setuptools.packages.find]
include = ["console_proxy*"]

[tool.setuptools.package-data]
console_proxy = ["static/*", "templates/*"]